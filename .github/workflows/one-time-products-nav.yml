name: Add Products link to homepage

on:
  push:
    branches: [astro]

permissions:
  contents: write

jobs:
  patch-home-navigation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: astro
          fetch-depth: 0

      - name: Add Products link
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/pages/index.astro')
          text = path.read_text(encoding='utf-8')
          marker = '      <li><a href="#infra">Infrastructure</a></li>'
          replacement = marker + '\n      <li><a href="/compuins/products/">Products</a></li>'

          if 'href="/compuins/products/"' not in text:
              if marker not in text:
                  raise SystemExit('Homepage navigation marker was not found.')
              path.write_text(text.replace(marker, replacement, 1), encoding='utf-8')
          else:
              print('Products link already exists.')

      - name: Commit homepage navigation change and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-time-products-nav.yml
          git add src/pages/index.astro .github/workflows/one-time-products-nav.yml
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "feat: add Products link to homepage navigation"
          git push origin HEAD:astro
